services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: caja
      POSTGRES_USER: caja
      POSTGRES_PASSWORD: caja
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caja -d caja"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
